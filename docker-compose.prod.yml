version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: binghatti_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binghatti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binghatti_prod_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-binghatti_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/01-migrations
      - ./db/seeds:/docker-entrypoint-initdb.d/02-seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binghatti_user} -d ${POSTGRES_DB:-binghatti_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - binghatti_net

  # 2. Go REST API Engine
  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binghatti_go_api_prod
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-binghatti_user}:${POSTGRES_PASSWORD:-binghatti_prod_secret_2026}@postgres:5432/${POSTGRES_DB:-binghatti_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-binghatti-production-jwt-secret-key-2026}
      ALLOWED_ORIGINS: "https://yourdomain.com,https://app.yourdomain.com"
      WHATSAPP_CLOUD_API_TOKEN: ${WHATSAPP_CLOUD_API_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      EXTERNAL_CRM_WEBHOOK_URL: ${EXTERNAL_CRM_WEBHOOK_URL}
      AGENT_ALERT_WEBHOOK_URL: ${AGENT_ALERT_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - binghatti_net

  # 3. Astro Public Landing Page
  astro-landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: binghatti_astro_landing_prod
    restart: always
    networks:
      - binghatti_net

  # 4. SvelteKit Admin Dashboard
  svelte-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: binghatti_svelte_dashboard_prod
    restart: always
    networks:
      - binghatti_net

  # 5. Production Nginx Reverse Proxy with Certbot SSL Support
  nginx-proxy:
    image: nginx:alpine
    container_name: binghatti_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - go-api
      - astro-landing
      - svelte-dashboard
    networks:
      - binghatti_net

networks:
  binghatti_net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
